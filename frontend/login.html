<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login | TshongMart</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <nav class="navbar">
      <a href="index.html" class="logo">TshongMart</a>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <a href="login.html" class="login-link">Login</a>
        <a href="signup.html" class="btn btn-small">Sign Up</a>
        <button class="menu-btn" id="menuBtn">☰</button>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-heading">
        <p class="eyebrow">Welcome back</p>
        <h1>Login to TshongMart</h1>
        <p>Access your dashboard, saved items, and product listings.</p>
      </div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" name="email" placeholder="example@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required />
        </div>

        <button type="submit" class="btn auth-btn">Login</button>

        <p class="auth-switch">
          Do not have an account?
          <a href="signup.html">Create one</a>
        </p>

        <p class="form-message" id="loginMessage"></p>
      </form>
    </section>
  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
